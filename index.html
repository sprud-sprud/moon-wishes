<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>달빛 아래 강강술래 🌕</title>
  
  <meta property="og:type" content="website" />
  <meta property="og:title" content="달빛 아래 강강술래 🌕" />
  <meta property="og:description" content="손을 잡고 함께 원을 만들어 달빛 아래 덕담을 나눠요!" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Pretendard", sans-serif;
      letter-spacing: normal !important; /* 글자 벌어짐 완전 방지 */
      word-break: keep-all;
    }

    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #FFF; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 16px; 
      overflow-x: hidden;
    }

    header { text-align: center; margin-top: 10px; margin-bottom: 15px; }
    h1 { font-size: 1.5rem; color: #FDE047; text-shadow: 0 0 15px rgba(253, 224, 71, 0.5); margin-bottom: 4px; }
    p.subtitle { font-size: 0.82rem; color: #9CA3AF; }

    /* 모바일 맞춤 원 크기 설정 */
    .sullae-wrapper { 
      position: relative; 
      margin: 20px auto 15px; 
      width: 280px; 
      height: 280px; 
    }

    .owner-zodiac-badge {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%); z-index: 25;
      background: rgba(17, 24, 39, 0.9); border: 1.5px solid #FDE047;
      backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 30px;
      display: none; align-items: center; gap: 6px;
      box-shadow: 0 0 15px rgba(253, 224, 71, 0.3);
      animation: floatBadge 3s ease-in-out infinite;
      white-space: nowrap;
    }
    .owner-zodiac-badge .z-icon { font-size: 1.2rem; }
    .owner-zodiac-badge .z-name { font-size: 0.8rem; font-weight: bold; color: #FDE047; }

    @keyframes floatBadge {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -5px); }
    }

    .center-moon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 120px; height: 120px;
      background: radial-gradient(circle, #FEF08A 0%, #FDE047 70%, #EAB308 100%);
      border-radius: 50%; box-shadow: 0 0 35px rgba(253, 224, 71, 0.5);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 5; text-align: center; padding: 8px;
    }
    .moon-text-count { font-size: 1rem; font-weight: bold; color: #854D0E; }
    .moon-text-sub { font-size: 0.7rem; color: #A16207; margin-top: 2px; }

    .sullae-circle { position: absolute; width: 100%; height: 100%; border-radius: 50%; z-index: 10; }

    /* 아바타 고정 크기 */
    .avatar-item {
      position: absolute; top: 50%; left: 50%;
      width: 44px; height: 44px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 15; user-select: none;
    }

    .avatar-inner {
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .avatar-item:hover .avatar-inner { transform: scale(1.2); }

    .avatar-emoji-box {
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid #FDE047;
      display: flex; justify-content: center; align-items: center;
      font-size: 1.4rem; line-height: 1;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .avatar-name {
      font-size: 0.62rem; font-weight: bold; background: rgba(0, 0, 0, 0.85);
      color: #FFF; padding: 2px 6px; border-radius: 8px; margin-top: 2px;
      white-space: nowrap; border: 1px solid rgba(253, 224, 71, 0.4); pointer-events: none;
    }

    /* 폼 카드 스타일 수정 */
    .form-card {
      background: rgba(31, 41, 55, 0.75); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 18px;
      padding: 16px; width: 100%; max-width: 340px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 8px; }
    label { display: block; font-size: 0.8rem; color: #FDE047; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"], input[type="password"], input[type="date"], textarea {
      width: 100%; padding: 8px 10px; border-radius: 10px; 
      border: 1px solid rgba(255, 255, 255, 0.15); outline: none; 
      background: rgba(17, 24, 39, 0.85); color: #F9FAFB; font-size: 0.85rem;
    }
    textarea { resize: none; height: 55px; }

    .zodiac-badge-info {
      background: rgba(253, 224, 71, 0.1); border: 1px dashed #FDE047; border-radius: 10px;
      padding: 8px; font-size: 0.78rem; color: #FDE047; text-align: center; margin-top: 8px; display: none; line-height: 1.35;
    }

    .submit-btn {
      width: 100%; padding: 11px; background: #FDE047; color: #111827; font-weight: bold;
      border: none; border-radius: 10px; font-size: 0.92rem; cursor: pointer; transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.9; }
    
    .btn-group { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .share-btn {
      width: 100%; padding: 9px; background: rgba(255, 255, 255, 0.08); color: #E5E7EB;
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; font-size: 0.8rem; cursor: pointer;
    }
    .create-new-btn {
      width: 100%; padding: 9px; background: rgba(253, 224, 71, 0.15); color: #FDE047; font-weight: bold;
      border: 1px solid rgba(253, 224, 71, 0.3); border-radius: 10px; font-size: 0.8rem; cursor: pointer;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 7, 18, 0.85);
      display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; z-index: 100;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: linear-gradient(135deg, #1F2937 0%, #111827 100%); color: #F9FAFB;
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 20px; border-radius: 20px; max-width: 310px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-avatar-box {
      width: 60px; height: 60px; border-radius: 50%; border: 2px solid #FDE047;
      margin: 0 auto 10px auto; display: flex; justify-content: center; align-items: center; font-size: 2rem;
    }
    .zodiac-tag { display: inline-block; padding: 5px 12px; border-radius: 16px; font-size: 0.78rem; font-weight: bold; color: #FFF; margin-bottom: 6px; }
    
    .modal-action-btns { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
    .close-btn { background: #374151; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .delete-btn { background: #EF4444; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1 id="pageTitle">달빛 아래 강강술래 🌕</h1>
    <p class="subtitle" id="pageSubtitle">손을 잡고 함께 원을 만들어 덕담을 나눠요!</p>
  </header>

  <div class="sullae-wrapper">
    <div class="owner-zodiac-badge" id="ownerZodiacBadge">
      <span class="z-icon" id="ownerZodiacIcon">✨</span>
      <span class="z-name" id="ownerZodiacText">별자리</span>
    </div>

    <div class="center-moon">
      <div class="moon-text-count" id="sullaeCount">0명</div>
      <div class="moon-text-sub">함께 손잡는 중!</div>
    </div>

    <div class="sullae-circle" id="sullaeCircle"></div>
  </div>

  <div class="form-card">
    <form id="duckdamForm">
      <div class="form-group">
        <div class="form-row">
          <div style="flex:1;">
            <label for="username">보내는 사람</label>
            <input type="text" id="username" placeholder="닉네임" maxlength="8" required />
          </div>
          <div style="flex:1.2;">
            <label for="birthdate">내 생년월일</label>
            <input type="date" id="birthdate" required />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="userPassword">삭제용 비밀번호 (4자리)</label>
        <input type="password" id="userPassword" placeholder="비밀번호 4자리 설정" maxlength="8" required />
        <div id="zodiacBadge" class="zodiac-badge-info"></div>
      </div>

      <div class="form-group">
        <label for="message">덕담 한마디</label>
        <textarea id="message" placeholder="달빛 아래 함께 손잡고 밝은 한가위 보내자!" maxlength="60" required></textarea>
      </div>

      <button type="submit" class="submit-btn">강강술래 손잡기 🤝</button>
      
      <div class="btn-group">
        <button type="button" id="shareBtn" class="share-btn">🔗 이 강강술래 주소 복사하기</button>
        <button type="button" id="createNewBtn" class="create-new-btn">🌕 나도 내 강강술래 만들기</button>
      </div>
    </form>
  </div>

  <!-- 주인 생성 모달 -->
  <div class="modal-overlay" id="ownerModal">
    <div class="modal-content">
      <h3 style="margin-bottom:6px; color:#FDE047; font-size:1.1rem;">🌕 내 강강술래 원 개설하기</h3>
      <p style="font-size:0.78rem; color:#9CA3AF; margin-bottom:14px;">닉네임과 생년월일을 입력하면 달빛 아래 모임이 시작됩니다!</p>
      <div class="form-group" style="text-align:left;">
        <label style="color:#D1D5DB;">주인 닉네임</label>
        <input type="text" id="ownerNameInput" placeholder="예: 달빛초롱" required />
      </div>
      <div class="form-group" style="text-align:left;">
        <label style="color:#D1D5DB;">주인 생년월일</label>
        <input type="date" id="ownerBirthInput" required />
      </div>
      <button class="submit-btn" id="saveOwnerBtn">강강술래 시작하기 🚀</button>
    </div>
  </div>

  <!-- 덕담 확인 & 삭제 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-avatar-box" id="modalAvatarBox">🐰</div>
      <div><span class="zodiac-tag" id="modalTag">✨ 별자리 케미</span></div>
      <div style="font-weight:bold; color:#F9FAFB; font-size:1rem; margin-top: 4px;" id="modalName">홍길동</div>
      <div style="font-size:0.9rem; line-height:1.45; color:#D1D5DB; margin-top:8px; margin-bottom:14px;" id="modalText">덕담 내용</div>
      
      <div class="modal-action-btns">
        <button class="close-btn" id="closeModal">닫기</button>
        <button class="delete-btn" id="deleteDuckdamBtn">🗑️ 손놓기 (삭제)</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6Gl5fByMl2EEvu3PO2ja_H20dllTliM0",
      authDomain: "moon-wishes.firebaseapp.com",
      databaseURL: "https://moon-wishes-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "moon-wishes",
      storageBucket: "moon-wishes.firebasestorage.app",
      messagingSenderId: "337988318732",
      appId: "1:337988318732:web:31ef9f89d85f07ffa5a029",
      measurementId: "G-818HYR468B"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const emojiList = ['🐰', '🐱', '🐶', '🦊', '🐻', '🐼', '🐥', '🐹', '🐨', '🐯', '👧🏻', '👦🏻', '🧙🏻‍♀️', '🧚🏻‍♀️', '👧🏽', '🏼‍♂️'];
    const bgColors = ['#FEF08A', '#FBCFE8', '#BFDBFE', '#BBF7D0', '#FED7AA', '#E9D5FF'];

    function getRandomEmojiProfile(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      const emoji = emojiList[Math.abs(hash) % emojiList.length];
      const bg = bgColors[Math.abs(hash) % bgColors.length];
      return { emoji, bg };
    }

    const zodiacList = [
      { name: "염소자리", symbol: "♑", element: "earth", tagColor: "#78350F", start: [12, 22], end: [1, 19] },
      { name: "물병자리", symbol: "♒", element: "air",   tagColor: "#D97706", start: [1, 20], end: [2, 18] },
      { name: "물고기자리", symbol: "♓", element: "water", tagColor: "#2563EB", start: [2, 19], end: [3, 20] },
      { name: "양자리",   symbol: "♈", element: "fire",  tagColor: "#DC2626", start: [3, 21], end: [4, 19] },
      { name: "황소자리", symbol: "♉", element: "earth", tagColor: "#78350F", start: [4, 20], end: [5, 20] },
      { name: "쌍둥이자리", symbol: "♊", element: "air",   tagColor: "#D97706", start: [5, 21], end: [6, 21] },
      { name: "게자리",   symbol: "♋", element: "water", tagColor: "#2563EB", start: [6, 22], end: [7, 22] },
      { name: "사자자리", symbol: "♌", element: "fire",  tagColor: "#DC2626", start: [7, 23], end: [8, 22] },
      { name: "처녀자리", symbol: "♍", element: "earth", tagColor: "#78350F", start: [8, 23], end: [9, 22] },
      { name: "천칭자리", symbol: "♎", element: "air",   tagColor: "#D97706", start: [9, 23], end: [10, 23] },
      { name: "전갈자리", symbol: "♏", element: "water", tagColor: "#2563EB", start: [10, 24], end: [11, 22] },
      { name: "사수자리", symbol: "♐", element: "fire",  tagColor: "#DC2626", start: [11, 23], end: [12, 21] }
    ];

    function getZodiacByDate(dateString) {
      if (!dateString) return zodiacList[0];
      const date = new Date(dateString);
      const m = date.getMonth() + 1;
      const d = date.getDate();

      for (let z of zodiacList) {
        if (z.name === "염소자리") {
          if ((m === 12 && d >= 22) || (m === 1 && d <= 19)) return z;
        } else {
          if ((m === z.start[0] && d >= z.start[1]) || (m === z.end[0] && d <= z.end[1])) return z;
        }
      }
      return zodiacList[0];
    }

    function getZodiacRelation(ownerZodiac, friendZodiac, ownerName) {
      if (ownerZodiac.name === friendZodiac.name) {
        return `💖 ${ownerName}님과 시너지 폭발하는 '데칼코마니 찰떡 파트너'`;
      }
      if (ownerZodiac.element === friendZodiac.element) {
        return `🔥 ${ownerName}님과 뜻이 딱 통하는 '행운의 영혼 콤비'`;
      }
      
      const isBestCombo = 
        (ownerZodiac.element === 'fire' && friendZodiac.element === 'air') ||
        (ownerZodiac.element === 'air' && friendZodiac.element === 'fire') ||
        (ownerZodiac.element === 'earth' && friendZodiac.element === 'water') ||
        (ownerZodiac.element === 'water' && friendZodiac.element === 'earth');

      if (isBestCombo) {
        return `✨ ${ownerName}님의 시름을 녹여주는 '환상의 별자리 수호신'`;
      } else {
        return `🌙 ${ownerName}님에게 색다른 매력을 주는 '반전의 꿀귀인'`;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    let ownerName = urlParams.get('moon') ? decodeURIComponent(urlParams.get('moon')) : null;
    let ownerBirth = urlParams.get('birth') || null;
    let ownerZodiac = ownerBirth ? getZodiacByDate(ownerBirth) : null;

    const ownerModal = document.getElementById('ownerModal');

    if (!ownerName || !ownerBirth) {
      ownerModal.classList.add('active');
    } else {
      updatePageHeader();
      listenForDuckdams();
    }

    function updatePageHeader() {
      document.title = `${ownerName}님의 달빛 아래 강강술래 🌕`;
      document.getElementById('pageTitle').innerText = `${ownerName}님의 강강술래 🌕`;
      document.getElementById('pageSubtitle').innerText = `${ownerName}님과 손을 잡고 덕담을 올려보세요!`;
      
      const badge = document.getElementById('ownerZodiacBadge');
      document.getElementById('ownerZodiacIcon').innerText = ownerZodiac.symbol;
      document.getElementById('ownerZodiacText').innerText = ownerZodiac.name;
      badge.style.display = 'flex';
    }

    document.getElementById('saveOwnerBtn').addEventListener('click', () => {
      const nameVal = document.getElementById('ownerNameInput').value.trim();
      const birthVal = document.getElementById('ownerBirthInput').value;

      if (!nameVal || !birthVal) {
        alert('닉네임과 생년월일을 입력해주세요!');
        return;
      }

      ownerName = nameVal;
      ownerBirth = birthVal;
      ownerZodiac = getZodiacByDate(ownerBirth);

      ownerModal.classList.remove('active');
      updatePageHeader();

      const newUrl = `${window.location.origin}${window.location.pathname}?moon=${encodeURIComponent(ownerName)}&birth=${ownerBirth}`;
      window.history.replaceState(null, '', newUrl);
      listenForDuckdams();
      alert(`[${ownerName}]님의 강강술래 원이 개설되었습니다!\n링크를 복사해 친구들에게 공유하세요.`);
    });

    let friendZodiac = null;
    const birthInput = document.getElementById('birthdate');
    const zodiacBadge = document.getElementById('zodiacBadge');

    birthInput.addEventListener('change', (e) => {
      if (!e.target.value) return;
      friendZodiac = getZodiacByDate(e.target.value);
      const relationText = getZodiacRelation(ownerZodiac, friendZodiac, ownerName);
      
      zodiacBadge.style.display = 'block';
      zodiacBadge.innerHTML = `내 별자리: <b>[${friendZodiac.name} ${friendZodiac.symbol}]</b><br/>${relationText}`;
    });

    let duckdamList = [];
    let selectedDuckdamKey = null;
    let selectedDuckdamPw = null;

    const circle = document.getElementById('sullaeCircle');
    const duckdamForm = document.getElementById('duckdamForm');

    function listenForDuckdams() {
      if (!ownerName || !ownerBirth) return;
      const moonId = `${ownerName}_${ownerBirth}`.replace(/[.#$\[\]]/g, "_");
      
      db.ref(`moons/${moonId}/duckdams`).on('value', (snapshot) => {
        duckdamList = [];
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(key => {
            duckdamList.push({ key: key, ...data[key] });
          });
        }
        renderSullaeCircle();
      }, (error) => {
        alert("DB 읽기 에러 발생: " + error.message);
      });
    }

    function renderSullaeCircle() {
      circle.innerHTML = '';
      const total = duckdamList.length;
      document.getElementById('sullaeCount').innerText = `${total}명`;

      const radius = 110;

      duckdamList.forEach((item, index) => {
        const angle = (index / total) * 2 * Math.PI - (Math.PI / 2);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        const div = document.createElement('div');
        div.className = 'avatar-item';
        div.style.transform = `translate(${x - 22}px, ${y - 22}px)`;

        const profile = item.profile || getRandomEmojiProfile(item.name);

        div.innerHTML = `
          <div class="avatar-inner">
            <div class="avatar-emoji-box" style="background-color: ${profile.bg};">
              ${profile.emoji}
            </div>
            <div class="avatar-name">${item.name}</div>
          </div>
        `;

        div.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedDuckdamKey = item.key;
          selectedDuckdamPw = item.password;

          const modalAvatarBox = document.getElementById('modalAvatarBox');
          modalAvatarBox.innerText = profile.emoji;
          modalAvatarBox.style.backgroundColor = profile.bg;
          
          const modalTag = document.getElementById('modalTag');
          modalTag.innerText = item.relation;
          modalTag.style.backgroundColor = item.zodiac.tagColor;

          document.getElementById('modalName').innerText = `${item.name} 님 (${item.zodiac.name} ${item.zodiac.symbol})`;
          document.getElementById('modalText').innerText = item.message;
          document.getElementById('modal').classList.add('active');
        });

        circle.appendChild(div);
      });
    }

    duckdamForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('userPassword').value;
      const messageInput = document.getElementById('message').value;

      if (!friendZodiac) friendZodiac = getZodiacByDate(birthInput.value);
      const relationText = getZodiacRelation(ownerZodiac, friendZodiac, ownerName);
      const profile = getRandomEmojiProfile(nameInput);

      const newDuckdam = {
        name: nameInput,
        password: passwordInput,
        message: messageInput,
        zodiac: friendZodiac,
        relation: relationText,
        profile: profile,
        timestamp: Date.now()
      };

      const moonId = `${ownerName}_${ownerBirth}`.replace(/[.#$\[\]]/g, "_");
      
      db.ref(`moons/${moonId}/duckdams`).push(newDuckdam, (error) => {
        if (error) {
          alert("저장 에러 원인: " + error.message);
        } else {
          document.getElementById('username').value = '';
          document.getElementById('userPassword').value = '';
          document.getElementById('message').value = '';
          alert(`[${friendZodiac.name}] 기운으로 ${ownerName}님의 강강술래 원에 함께 손을 잡았습니다! 🤝`);
        }
      });
    });

    document.getElementById('deleteDuckdamBtn').addEventListener('click', () => {
      const inputPw = prompt("손을 놓으시려면 설정했던 비밀번호를 입력해주세요:");
      if (!inputPw) return;

      if (inputPw === selectedDuckdamPw) {
        const moonId = `${ownerName}_${ownerBirth}`.replace(/[.#$\[\]]/g, "_");
        db.ref(`moons/${moonId}/duckdams/${selectedDuckdamKey}`).remove()
          .then(() => {
            alert("강강술래 원에서 빠졌습니다! 🧹");
            document.getElementById('modal').classList.remove('active');
          })
          .catch((err) => {
            alert("삭제 실패: " + err.message);
          });
      } else {
        alert("비밀번호가 일치하지 않습니다! ❌");
      }
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert(`[${ownerName}]님의 강강술래 링크가 복사되었습니다!\n친구들에게 전달해 보세요.`);
      });
    });

    // 강강술래 만들기 코드 검증 로직 추가
    document.getElementById('createNewBtn').addEventListener('click', () => {
      const requestCode = prompt("개발자에게 강강술래 코드를 요청하세요");
      
      if (requestCode === null) return;

      if (requestCode.trim() === "한가위2026") {
        document.getElementById('ownerNameInput').value = '';
        document.getElementById('ownerBirthInput').value = '';
        ownerModal.classList.add('active');
      } else {
        alert("코드가 올바르지 않습니다. 개발자에게 문의하세요.");
      }
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('active');
    });
  </script>
</body>
</html>
