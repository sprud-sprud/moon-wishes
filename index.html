<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>별자리 은하수 소원 밤하늘 🌌</title>
  
  <!-- Firebase SDK (Compat Version) CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body {
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      color: #FFF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-x: hidden;
    }
    header { text-align: center; margin-top: 15px; margin-bottom: 25px; }
    h1 { font-size: 1.7rem; color: #E2E8F0; text-shadow: 0 0 15px rgba(255, 255, 255, 0.6); margin-bottom: 6px; }
    p.subtitle { font-size: 0.88rem; color: #94A3B8; }

    .sky-wrapper { position: relative; margin: 30px auto 20px; }

    .owner-zodiac-badge {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 15;
      background: rgba(15, 23, 42, 0.85); border: 1.5px solid #38BDF8;
      backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 30px;
      display: none; align-items: center; gap: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      animation: floatBadge 3s ease-in-out infinite;
      white-space: nowrap;
    }
    .owner-zodiac-badge .z-icon { font-size: 1.4rem; }
    .owner-zodiac-badge .z-name { font-size: 0.85rem; font-weight: bold; color: #38BDF8; }

    @keyframes floatBadge {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    /* 은하수 수호성 원형 배경 */
    .galaxy-container {
      position: relative; width: 300px; height: 300px;
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0.8) 70%, rgba(2, 6, 23, 0.95) 100%);
      border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 30px rgba(56, 189, 248, 0.2), 0 0 40px rgba(0, 0, 0, 0.8);
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }

    /* 배경 별빛 반짝임 효과 */
    .galaxy-container::before {
      content: ''; position: absolute; width: 100%; height: 100%;
      background-image: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #38bdf8, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 150px 180px, #f472b6, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 230px 120px, #a78bfa, rgba(0,0,0,0));
      background-size: 280px 280px; opacity: 0.5;
    }

    .star-board {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 16px; padding: 35px; z-index: 2;
    }

    /* ✨ 별 아이템 디자인 */
    .star-shape {
      width: 32px; height: 32px; cursor: pointer; position: relative;
      display: flex; justify-content: center; align-items: center;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.25s;
      animation: starTwinkle 2.5s ease-in-out infinite alternate, popIn 0.4s ease-out;
    }
    .star-shape::before {
      content: '★'; font-size: 1.8rem; line-height: 1;
    }
    .star-shape:hover {
      transform: scale(1.5) rotate(15deg);
      filter: drop-shadow(0 0 12px currentColor);
    }

    /* 🎨 파스텔톤 빛나는 별 색상 정의 */
    .star-pink   { color: #F472B6; text-shadow: 0 0 8px #F472B6; }
    .star-cyan   { color: #38BDF8; text-shadow: 0 0 8px #38BDF8; }
    .star-yellow { color: #FACC15; text-shadow: 0 0 8px #FACC15; }
    .star-purple { color: #C084FC; text-shadow: 0 0 8px #C084FC; }
    .star-mint   { color: #34D399; text-shadow: 0 0 8px #34D399; }
    .star-white  { color: #F8FAFC; text-shadow: 0 0 8px #F8FAFC; }

    @keyframes starTwinkle {
      0% { opacity: 0.7; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .form-card {
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px;
      padding: 20px; width: 100%; max-width: 360px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 8px; }
    label { display: block; font-size: 0.85rem; color: #38BDF8; margin-bottom: 8px; }
    input[type="text"], input[type="password"], input[type="date"], textarea {
      width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); outline: none; background: rgba(30, 41, 59, 0.8); color: #F8FAFC; font-size: 0.88rem;
    }
    textarea { resize: none; height: 60px; }

    .zodiac-badge-info {
      background: rgba(56, 189, 248, 0.1); border: 1px dashed #38BDF8; border-radius: 12px;
      padding: 10px; font-size: 0.82rem; color: #38BDF8; text-align: center; margin-top: 6px; display: none; line-height: 1.4;
    }

    .submit-btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #38BDF8, #818CF8); color: #0F172A; font-weight: bold;
      border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; margin-top: 6px; transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.9; }
    
    .btn-group { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .share-btn {
      width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.08); color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font-size: 0.83rem; cursor: pointer; transition: background 0.2s;
    }
    .share-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .create-new-btn {
      width: 100%; padding: 10px; background: rgba(129, 140, 248, 0.2); color: #A5B4FC; font-weight: bold;
      border: 1px solid rgba(129, 140, 248, 0.4); border-radius: 12px; font-size: 0.83rem; cursor: pointer;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2, 6, 23, 0.85);
      display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; z-index: 100;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%); color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 24px; border-radius: 24px; max-width: 320px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .zodiac-tag { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: #FFF; margin-bottom: 8px; }
    
    .modal-action-btns { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
    .close-btn { background: #334155; color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
    .delete-btn { background: #EF4444; color: white; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <h1 id="pageTitle">별자리 은하수 소원 밤하늘 🌌</h1>
    <p class="subtitle" id="pageSubtitle">소중한 별빛 메시지를 하늘에 띄워보세요!</p>
  </header>

  <div class="sky-wrapper">
    <div class="owner-zodiac-badge" id="ownerZodiacBadge">
      <span class="z-icon" id="ownerZodiacIcon">✨</span>
      <span class="z-name" id="ownerZodiacText">별자리</span>
    </div>

    <div class="galaxy-container">
      <div class="star-board" id="starBoard"></div>
    </div>
  </div>

  <div class="form-card">
    <form id="duckdamForm">
      <div class="form-group">
        <div class="form-row">
          <div style="flex:1;">
            <label for="username">보내는 사람</label>
            <input type="text" id="username" placeholder="닉네임" maxlength="8" required />
          </div>
          <div style="flex:1.2;">
            <label for="birthdate">내 생년월일</label>
            <input type="date" id="birthdate" required />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="userPassword">삭제용 비밀번호 (4자리)</label>
        <input type="password" id="userPassword" placeholder="비밀번호 4자리 설정" maxlength="8" required />
        <div id="zodiacBadge" class="zodiac-badge-info"></div>
      </div>

      <div class="form-group">
        <label for="message">별빛 소원 한마디</label>
        <textarea id="message" placeholder="달빛과 별빛 아래 풍성하고 따뜻한 가을 보내길!" maxlength="60" required></textarea>
      </div>

      <button type="submit" class="submit-btn">별빛 수호신 띄우기 ✨</button>
      
      <div class="btn-group">
        <button type="button" id="shareBtn" class="share-btn">🔗 이 은하수 주소 복사하기</button>
        <button type="button" id="createNewBtn" class="create-new-btn">🌌 나도 내 별자리 은하수 만들기</button>
      </div>
    </form>
  </div>

  <!-- 주인 생성 모달 -->
  <div class="modal-overlay" id="ownerModal">
    <div class="modal-content">
      <h3 style="margin-bottom:8px; color:#38BDF8;">🌌 내 별자리 은하수 개설하기</h3>
      <p style="font-size:0.82rem; color:#94A3B8; margin-bottom:16px;">닉네임과 생년월일을 입력하면 수호 별자리 은하수가 펼쳐집니다!</p>
      <div class="form-group" style="text-align:left;">
        <label style="color:#CBD5E1;">주인 닉네임</label>
        <input type="text" id="ownerNameInput" placeholder="예: 별빛하늘" required />
      </div>
      <div class="form-group" style="text-align:left;">
        <label style="color:#CBD5E1;">주인 생년월일</label>
        <input type="date" id="ownerBirthInput" required />
      </div>
      <button class="submit-btn" id="saveOwnerBtn">은하수 밤하늘 열기 🚀</button>
    </div>
  </div>

  <!-- 별빛 정보 & 삭제 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:center; margin-bottom:12px;">
        <div class="star-shape" id="modalStar" style="transform: scale(1.6);"></div>
      </div>
      <div class="zodiac-tag" id="modalTag">✨ 별자리 케미</div>
      <div style="font-weight:bold; color:#F8FAFC; font-size:1.1rem; margin-top: 6px;" id="modalName">홍길동</div>
      <div style="font-size:0.95rem; line-height:1.5; color:#CBD5E1; margin-top:10px; margin-bottom:18px;" id="modalText">덕담 내용</div>
      
      <div class="modal-action-btns">
        <button class="close-btn" id="closeModal">닫기</button>
        <button class="delete-btn" id="deleteDuckdamBtn">🗑️ 삭제하기</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6Gl5fByMl2EEvu3PO2ja_H20dllTliM0",
      authDomain: "moon-wishes.firebaseapp.com",
      databaseURL: "https://moon-wishes-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "moon-wishes",
      storageBucket: "moon-wishes.firebasestorage.app",
      messagingSenderId: "337988318732",
      appId: "1:337988318732:web:31ef9f89d85f07ffa5a029",
      measurementId: "G-818HYR468B"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 🎨 파스텔 별빛 색상 클래스
    const starColors = [
      'star-pink', 'star-cyan', 'star-yellow',
      'star-purple', 'star-mint', 'star-white'
    ];

    function getRandomStarColor() {
      return starColors[Math.floor(Math.random() * starColors.length)];
    }

    const zodiacList = [
      { name: "염소자리", symbol: "♑", element: "earth", tagColor: "#78350F", start: [12, 22], end: [1, 19] },
      { name: "물병자리", symbol: "♒", element: "air",   tagColor: "#D97706", start: [1, 20], end: [2, 18] },
      { name: "물고기자리", symbol: "♓", element: "water", tagColor: "#2563EB", start: [2, 19], end: [3, 20] },
      { name: "양자리",   symbol: "♈", element: "fire",  tagColor: "#DC2626", start: [3, 21], end: [4, 19] },
      { name: "황소자리", symbol: "♉", element: "earth", tagColor: "#78350F", start: [4, 20], end: [5, 20] },
      { name: "쌍둥이자리", symbol: "♊", element: "air",   tagColor: "#D97706", start: [5, 21], end: [6, 21] },
      { name: "게자리",   symbol: "♋", element: "water", tagColor: "#2563EB", start: [6, 22], end: [7, 22] },
      { name: "사자자리", symbol: "♌", element: "fire",  tagColor: "#DC2626", start: [7, 23], end: [8, 22] },
      { name: "처녀자리", symbol: "♍", element: "earth", tagColor: "#78350F", start: [8, 23], end: [9, 22] },
      { name: "천칭자리", symbol: "♎", element: "air",   tagColor: "#D97706", start: [9, 23], end: [10, 23] },
      { name: "전갈자리", symbol: "♏", element: "water", tagColor: "#2563EB", start: [10, 24], end: [11, 22] },
      { name: "사수자리", symbol: "♐", element: "fire",  tagColor: "#DC2626", start: [11, 23], end: [12, 21] }
    ];

    function getZodiacByDate(dateString) {
      if (!dateString) return zodiacList[0];
      const date = new Date(dateString);
      const m = date.getMonth() + 1;
      const d = date.getDate();

      for (let z of zodiacList) {
        if (z.name === "염소자리") {
          if ((m === 12 && d >= 22) || (m === 1 && d <= 19)) return z;
        } else {
          if ((m === z.start[0] && d >= z.start[1]) || (m === z.end[0] && d <= z.end[1])) return z;
        }
      }
      return zodiacList[0];
    }

    function getZodiacRelation(ownerZodiac, friendZodiac, ownerName) {
      if (ownerZodiac.name === friendZodiac.name) {
        return `💖 ${ownerName}님과 시너지 폭발하는 '데칼코마니 찰떡 파트너'`;
      }
      if (ownerZodiac.element === friendZodiac.element) {
        return `🔥 ${ownerName}님과 뜻이 딱 통하는 '행운의 영혼 콤비'`;
      }
      
      const isBestCombo = 
        (ownerZodiac.element === 'fire' && friendZodiac.element === 'air') ||
        (ownerZodiac.element === 'air' && friendZodiac.element === 'fire') ||
        (ownerZodiac.element === 'earth' && friendZodiac.element === 'water') ||
        (ownerZodiac.element === 'water' && friendZodiac.element === 'earth');

      if (isBestCombo) {
        return `✨ ${ownerName}님의 시름을 녹여주는 '환상의 별자리 수호신'`;
      } else {
        return `🌙 ${ownerName}님에게 색다른 매력을 주는 '반전의 꿀귀인'`;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    let ownerName = urlParams.get('moon') ? decodeURIComponent(urlParams.get('moon')) : null;
    let ownerBirth = urlParams.get('birth') || null;
    let ownerZodiac = ownerBirth ? getZodiacByDate(ownerBirth) : null;

    const ownerModal = document.getElementById('ownerModal');

    if (!ownerName || !ownerBirth) {
      ownerModal.classList.add('active');
    } else {
      updatePageHeader();
      listenForDuckdams();
    }

    function updatePageHeader() {
      document.getElementById('pageTitle').innerText = `${ownerName}님의 별자리 은하수 🌌`;
      document.getElementById('pageSubtitle').innerText = `${ownerName}님을 향한 별빛 소원을 남겨보세요!`;
      
      const badge = document.getElementById('ownerZodiacBadge');
      document.getElementById('ownerZodiacIcon').innerText = ownerZodiac.symbol;
      document.getElementById('ownerZodiacText').innerText = ownerZodiac.name;
      badge.style.display = 'flex';
    }

    document.getElementById('saveOwnerBtn').addEventListener('click', () => {
      const nameVal = document.getElementById('ownerNameInput').value.trim();
      const birthVal = document.getElementById('ownerBirthInput').value;

      if (!nameVal || !birthVal) {
        alert('닉네임과 생년월일을 입력해주세요!');
        return;
      }

      ownerName = nameVal;
      ownerBirth = birthVal;
      ownerZodiac = getZodiacByDate(ownerBirth);

      ownerModal.classList.remove('active');
      updatePageHeader();

      const newUrl = `${window.location.origin}${window.location.pathname}?moon=${encodeURIComponent(ownerName)}&birth=${ownerBirth}`;
      window.history.replaceState(null, '', newUrl);
      listenForDuckdams();
      alert(`[${ownerName}]님의 별자리 은하수가 개설되었습니다!\n링크를 복사해 친구들에게 공유하세요.`);
    });

    let friendZodiac = null;
    const birthInput = document.getElementById('birthdate');
    const zodiacBadge = document.getElementById('zodiacBadge');

    birthInput.addEventListener('change', (e) => {
      if (!e.target.value) return;
      friendZodiac = getZodiacByDate(e.target.value);
      const relationText = getZodiacRelation(ownerZodiac, friendZodiac, ownerName);
      
      zodiacBadge.style.display = 'block';
      zodiacBadge.innerHTML = `내 별자리: <b>[${friendZodiac.name} ${friendZodiac.symbol}]</b><br/>${relationText}`;
    });

    let duckdamList = [];
    let selectedDuckdamKey = null;
    let selectedDuckdamPw = null;

    const board = document.getElementById('starBoard');
    const duckdamForm = document.getElementById('duckdamForm');

    function listenForDuckdams() {
      if (!ownerName || !ownerBirth) return;
      const moonId = `${ownerName}_${ownerBirth}`.replace(/[.#$\[\]]/g, "_");
      
      db.ref(`moons/${moonId}/duckdams`).on('value', (snapshot) => {
        duckdamList = [];
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(key => {
            duckdamList.push({ key: key, ...data[key] });
          });
        }
        renderStars();
      }, (error) => {
        alert("DB 읽기 에러 발생: " + error.message);
      });
    }

    function renderStars() {
      board.innerHTML = '';
      duckdamList.forEach((item) => {
        const div = document.createElement('div');
        const colorClass = item.colorClass || getRandomStarColor();
        div.className = `star-shape ${colorClass}`;

        div.addEventListener('click', () => {
          selectedDuckdamKey = item.key;
          selectedDuckdamPw = item.password;

          document.getElementById('modalStar').className = `star-shape ${colorClass}`;
          
          const modalTag = document.getElementById('modalTag');
          modalTag.innerText = item.relation;
          modalTag.style.backgroundColor = item.zodiac.tagColor;

          document.getElementById('modalName').innerText = `${item.name} 님 (${item.zodiac.name} ${item.zodiac.symbol})`;
          document.getElementById('modalText').innerText = item.message;
          document.getElementById('modal').classList.add('active');
        });

        board.appendChild(div);
      });
    }

    duckdamForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('userPassword').value;
      const messageInput = document.getElementById('message').value;

      if (!friendZodiac) friendZodiac = getZodiacByDate(birthInput.value);
      const relationText = getZodiacRelation(ownerZodiac, friendZodiac, ownerName);
      const chosenColor = getRandomStarColor();

      const newDuckdam = {
        name: nameInput,
        password: passwordInput,
        message: messageInput,
        zodiac: friendZodiac,
        relation: relationText,
        colorClass: chosenColor,
        timestamp: Date.now()
      };

      const moonId = `${ownerName}_${ownerBirth}`.replace(/[.#$\[\]]/g, "_");
      
      db.ref(`moons/${moonId}/duckdams`).push(newDuckdam, (error) => {
        if (error) {
          alert("저장 에러 원인: " + error.message);
        } else {
          document.getElementById('username').value = '';
          document.getElementById('userPassword').value = '';
          document.getElementById('message').value = '';
          alert(`[${friendZodiac.name}] 수호 기운을 담아 ${ownerName}님의 은하수에 별빛을 새겼습니다! ✨`);
        }
      });
    });

    document.getElementById('deleteDuckdamBtn').addEventListener('click', () => {
      const inputPw = prompt("별빛 소원을 설정할 때 입력한 비밀번호를 입력해주세요:");
      if (!inputPw) return;

      if (inputPw === selectedDuckdamPw) {
        const moonId = `${ownerName}_${ownerBirth}`.replace(/[.#$\[\]]/g, "_");
        db.ref(`moons/${moonId}/duckdams/${selectedDuckdamKey}`).remove()
          .then(() => {
            alert("별빛 소원이 성공적으로 삭제되었습니다! 🧹");
            document.getElementById('modal').classList.remove('active');
          })
          .catch((err) => {
            alert("삭제 실패: " + err.message);
          });
      } else {
        alert("비밀번호가 일치하지 않습니다! ❌");
      }
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert(`[${ownerName}]님의 별자리 은하수 링크가 복사되었습니다!\n친구들에게 전달해 보세요.`);
      });
    });

    document.getElementById('createNewBtn').addEventListener('click', () => {
      document.getElementById('ownerNameInput').value = '';
      document.getElementById('ownerBirthInput').value = '';
      ownerModal.classList.add('active');
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('active');
    });
  </script>
</body>
</html>
